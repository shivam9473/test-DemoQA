name: Advanced SDET CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api-tests:
    name: API — Restful Booker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - run: mvn -B test -pl booker-api-tests

  ui-smoke:
    name: UI — DemoQA smoke (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - run: mvn -B test -pl demoqa-ui-tests -Dheadless=true -Denv=ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-smoke
          path: demoqa-ui-tests/target/allure-results/
          if-no-files-found: ignore

  ui-regression:
    name: UI — DemoQA regression (headless)
    runs-on: ubuntu-latest
    needs: ui-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - run: mvn -B test -pl demoqa-ui-tests -Pregression,ci -Dheadless=true -Denv=ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-regression
          path: demoqa-ui-tests/target/allure-results/
          if-no-files-found: ignore
